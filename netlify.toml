# Hugo >= 0.15x no longer bundles LibSass; Dart Sass is installed before each build.
[build]
  command = "./netlify-build.sh -b $URL"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.170.1"
  DART_SASS_VERSION = "1.89.2"
  HUGO_ENABLEGITINFO = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "./netlify-build.sh --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "./netlify-build.sh -b $DEPLOY_PRIME_URL"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
